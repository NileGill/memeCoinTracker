# On every push to main: type-check and build, then tell Render to deploy.
# A broken build never reaches the live site.
#
# One-time setup: copy the "Deploy Hook" URL from the Render service's Settings page and
# save it in GitHub (repo Settings > Secrets and variables > Actions) as RENDER_DEPLOY_HOOK.
name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set, so the live site was not updated."
            exit 0
          fi
          # A deploy hook looks like https://api.render.com/deploy/srv-...?key=...
          # (Pasting the site's own address would "succeed" without deploying anything.)
          case "$RENDER_DEPLOY_HOOK" in
            https://api.render.com/deploy/srv-*) ;;
            *)
              echo "::error::RENDER_DEPLOY_HOOK is not a Render deploy hook. In Render open the service > Settings > Deploy Hook, copy the URL that starts with https://api.render.com/deploy/srv- and save it as the secret."
              exit 1
              ;;
          esac
          RESPONSE=$(curl -sS -w '\nHTTP %{http_code}' -X POST "$RENDER_DEPLOY_HOOK")
          echo "$RESPONSE" | sed 's/key=[^&"]*/key=***/g'
          case "$RESPONSE" in
            *"HTTP 2"*) echo "Render deploy started. The site updates in about 3 minutes." ;;
            *) echo "::error::Render rejected the deploy request. Check the RENDER_DEPLOY_HOOK secret."; exit 1 ;;
          esac
